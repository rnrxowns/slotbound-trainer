# Actions에서 배포용 EXE를 다운로드할 수 있습니다.
# v* 태그를 푸시하면 GitHub Release에도 EXE를 첨부합니다.
name: build

on:
  push:
    branches: [main, korean-localization]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # v* 태그의 Release 발행에 사용합니다.

jobs:
  build:
    # build.ps1에서 Visual Studio 2022 생성기를 사용합니다.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build portable package
        shell: pwsh
        run: ./build.ps1 -Dist

      - name: Name the package
        id: pkg
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "name=slotbound-trainer-ko-$ver" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/slotbound_trainer_ko.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/slotbound_trainer_ko.exe --title $env:GITHUB_REF_NAME --generate-notes
